{% load static %}<!doctype html>
<html lang="en" {% if theme %}data-theme="{{ theme }}"{% endif %}>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Member portal{% endblock %} | {{ site.short_name }}</title><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@300;400;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="{% static 'img/logo-mark.png' %}">
<link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body data-idle="600" data-warn="540">
<header class="topbar np" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgb(var(--sf));border-bottom:1px solid rgb(var(--ln))">
<img src="{% static 'img/logo-mark.png' %}" alt="" style="height:34px"><b style="font-family:Inter;color:rgb(var(--pr))">{{ site.name }}</b><span class="mute small">Member portal</span><span style="flex:1"></span>
<a class="btn ghost sm" href="{% url 'portal:home' %}">Home</a>
<form method="post" action="{% url 'portal:logout' %}" class="inline" data-confirm="You will be signed out of the member portal." data-confirm-title="Sign out?" data-confirm-ok="Sign out">{% csrf_token %}<button class="btn ghost sm" type="submit">Sign out</button></form></header>
<main class="main" style="max-width:1000px;margin:0 auto;padding:18px 16px">{% block content %}{% endblock %}</main>
<div id="toasts" aria-live="polite">{% for m in messages %}<div class="toast {{ m.tags }}" role="status"><span>{{ m }}</span><button type="button" aria-label="Dismiss">&times;</button></div>{% endfor %}</div>
<script src="{% static 'js/app.js' %}" defer></script>
</body></html>
